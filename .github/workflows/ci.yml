name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.9.4
        with:
          # Unpinned on purpose. [package.build] now takes a backend
          # *range*, so the solver matches the backend to whatever pixi
          # this runner ships -- which is the behaviour we want CI to
          # exercise, since it is what a user gets. The old v0.70.2 pin
          # existed only to keep an exact `==0.3.13` backend resolvable.
          cache: false
          post-cleanup: false

      - name: Run tests
        run: pixi run tests-cpu

      # The default environment is meant to be exactly what a consumer
      # of the published package gets. One new import of `json.gpu` from
      # the CPU path would put a proprietary-licensed dependency back
      # into every downstream lock file with nothing else failing, so
      # the property is asserted rather than assumed.
      - name: Assert the default environment has no MAX
        run: pixi run verify-cpu-only

  # Build the conda package exactly as a downstream consumer does.
  #
  # `tests-cpu` never runs `recipe.yaml`'s build script, so a break in
  # the packaged build was invisible here and only surfaced downstream:
  # simdjson 4.6.11 uses `std::inserter` without including <iterator>,
  # which libstdc++ pulls in transitively but libc++ does not, so
  # `pixi build` failed on macOS while every test stayed green. Both
  # platforms are built because that failure was platform-specific.
  package:
    name: Package build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.9.4
        with:
          cache: false
          post-cleanup: false

      - name: Build conda package
        run: pixi build -o dist

      # A package that declares MAX is one every consumer inherits it
      # from, whatever their own manifest says. The constraint is the
      # opposite: present so a consumer who does install max-core gets a
      # compatible one, absent from `depends` so nobody installs it by
      # accident.
      - name: Assert the package declares no MAX dependency
        if: runner.os == 'Linux'
        run: |
          pkg=$(ls dist/*/json-*.conda dist/json-*.conda 2>/dev/null | head -1)
          echo "inspecting $pkg"
          python3 - "$pkg" <<'PY'
          import json, sys, tarfile, zipfile, io
          try:
              import zstandard
          except ImportError:
              zstandard = None
          path = sys.argv[1]
          with zipfile.ZipFile(path) as z:
              name = next(n for n in z.namelist() if n.startswith("info-"))
              raw = z.read(name)
          if zstandard is None:
              print("zstandard unavailable; skipping deep check")
              sys.exit(0)
          data = zstandard.ZstdDecompressor().stream_reader(io.BytesIO(raw))
          with tarfile.open(fileobj=data, mode="r|") as t:
              for m in t:
                  if m.name == "info/index.json":
                      idx = json.load(t.extractfile(m))
                      break
          depends = idx.get("depends", [])
          constrains = idx.get("constrains", [])
          print("depends:", depends)
          print("constrains:", constrains)
          assert not any(d.split()[0].startswith("max") for d in depends), depends
          assert any(c.split()[0] == "max-core" for c in constrains), constrains
          print("OK")
          PY

  # Compiler warnings are about the published artifact, so the gate has
  # to cover the package, every test, every benchmark and every example
  # rather than whatever a given test run happens to compile. It was
  # never run here, which made it a gate in name only. One platform is
  # enough: the warnings this catches are not platform-specific, and
  # the job compiles close to fifty targets.
  warnings:
    name: Compiler warnings
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.9.4
        with:
          environments: dev
          cache: false
          post-cleanup: false

      - name: Check for warnings
        run: pixi run -e dev warnings-check

  # Formatting was enforced only by a local pre-commit hook, so a
  # contributor who had not run `install-pre-commit` had nothing
  # checking it anywhere. `format-check` is the non-mutating variant
  # and had no callers at all until now.
  format:
    name: Formatting
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.9.4
        with:
          environments: dev
          cache: false
          post-cleanup: false

      - name: Check formatting
        run: pixi run -e dev format-check

  # The GPU sources and the benchmark binaries are only ever built by
  # tasks nobody runs in CI, so a break in either was invisible until
  # someone benchmarked or reached for a device. Compiling them needs
  # no GPU and no dataset.
  compile-only:
    name: Compile-only targets
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.9.4
        with:
          environments: dev
          cache: false
          post-cleanup: false

      # `check-gpu-build` is deliberately absent. Compiling the GPU
      # sources needs a real accelerator, not just `max-core`: the
      # kernels are instantiated for a concrete architecture and the
      # compiler stops with "Unknown GPU architecture detected" on a
      # machine without one. `warnings-check` skips those targets for
      # the same reason. Run `pixi run -e gpu check-gpu-build` on a
      # machine with a device.

      - name: Build the benchmark binaries
        run: |
          pixi run -e dev build-bench-cpu
          pixi run -e dev build-bench-serde
          pixi run -e dev build-bench-build

  # AddressSanitizer over the FFI and lifetime-heavy tests. Linux only,
  # which is where the task supports it.
  sanitizers:
    name: AddressSanitizer
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.9.4
        with:
          environments: dev
          cache: false
          post-cleanup: false

      - name: Run sanitized tests
        run: pixi run -e dev tests-asan

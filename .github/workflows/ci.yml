name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.9.4
        with:
          # Unpinned on purpose. [package.build] now takes a backend
          # *range*, so the solver matches the backend to whatever pixi
          # this runner ships -- which is the behaviour we want CI to
          # exercise, since it is what a user gets. The old v0.70.2 pin
          # existed only to keep an exact `==0.3.13` backend resolvable.
          cache: false
          post-cleanup: false

      - name: Run tests
        run: pixi run tests-cpu
